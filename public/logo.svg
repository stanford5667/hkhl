<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- TrendingUp icon (scaled and centered) -->
  <g transform="translate(128, 128) scale(10.67)">
    <polyline 
      points="23 6 13.5 15.5 8.5 10.5 1 18" 
      stroke="white" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none"
    />
    <polyline 
      points="17 6 23 6 23 12" 
      stroke="white" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>